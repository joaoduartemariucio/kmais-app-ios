name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Lint and format
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint and SwiftFormat
        run: brew install swiftlint swiftformat

      - name: Lint
        run: make lint

      - name: Format check
        run: make format-check

  build-and-test:
    name: Build, test and coverage
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Build
        run: make build XCBEAUTIFY_FLAGS="--renderer github-actions"

      - name: Test
        run: make test XCBEAUTIFY_FLAGS="--renderer github-actions"

      - name: Coverage of changed lines
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=origin/main
          fi
          make coverage BASE="$BASE"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults.xcresult
          path: .build/TestResults.xcresult
          if-no-files-found: ignore
